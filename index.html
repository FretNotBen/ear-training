/* v0.9.4: truly viewport-fitted practice, no internal or page scrolling */
body:has(#game:not(.hidden)){overflow:hidden;height:100dvh}
body:has(#game:not(.hidden)) main{height:100dvh;max-width:100%;padding:8px 12px 8px;overflow:hidden}
#game:not(.hidden){height:100%;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
#game>.row{flex:0 0 auto;min-height:42px}
#game #clock{font-size:clamp(16px,3vh,26px)}

#game #feedback{flex:0 0 auto;margin:0;min-height:16px;font-size:clamp(10px,1.6vh,13px)}
#game #game-actions{flex:0 0 auto;position:static;padding:0;border:0;background:transparent;display:grid;grid-template-columns:2fr 1fr;gap:6px}
#game #game-actions button{margin:0!important;padding:clamp(7px,1.5vh,12px) 4px;font-size:clamp(11px,1.9vh,15px)}
@media(min-width:700px){body:has(#game:not(.hidden)) main{max-width:920px;padding:12px 20px}}
@media(max-height:580px){#game:not(.hidden){gap:2px}#game #direction{min-height:0}#game #answers .answer{font-size:clamp(8px,1.7vh,12px)}}

async function preparePiano(){
if(pianoLoading)return pianoLoading;
pianoLoading=Promise.all(Object.entries(pianoData).map(async ([midi,b64])=>{
const binary=atob(b64),bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
pianoBuffers[midi]=await ctx.decodeAudioData(bytes.buffer);
}));return pianoLoading;
}
// Build a seamless-ish sustain region for the longer chord notes.
// Blend the final 45 ms of each loop into the beginning of the loop,
// keeping the original transient untouched and preserving non-chord samples.
const smoothLoopBuffers={};
function smoothChordLoop(pitch){
if(smoothLoopBuffers[pitch])return smoothLoopBuffers[pitch];
const original=pianoBuffers[pitch],rate=original.sampleRate;
const start=Math.round(.65*rate),end=Math.min(Math.round(2.65*rate),original.length-Math.round(.12*rate));
const fade=Math.min(Math.round(.045*rate),Math.floor((end-start)/4));
const buffer=ctx.createBuffer(original.numberOfChannels,original.length,rate);
for(let channel=0;channel<original.numberOfChannels;channel++){
const input=original.getChannelData(channel),output=buffer.getChannelData(channel);
output.set(input);
for(let i=0;i<fade;i++){
const alpha=(i+1)/fade;
// Match the samples at the wrap point rather than hard-switching waveform phase.
output[end-fade+i]=input[end-fade+i]*(1-alpha)+input[start-fade+i]*alpha;
}
}
return smoothLoopBuffers[pitch]={buffer,start:start/rate,end:end/rate};
}
function piano(midi,time,length,volume,bus){
const pitches=Object.keys(pianoBuffers).map(Number);
const sourcePitch=pitches.reduce((a,b)=>Math.abs(b-midi)<Math.abs(a-midi)?b:a);
const source=ctx.createBufferSource();
if(length>=2.0){
const loop=smoothChordLoop(sourcePitch);
source.buffer=loop.buffer;source.loop=true;
source.loopStart=loop.start;source.loopEnd=loop.end;
}else source.buffer=pianoBuffers[sourcePitch];
source.playbackRate.value=Math.pow(2,(midi-sourcePitch)/12);
const gain=ctx.createGain();gain.gain.setValueAtTime(.0001,time);
gain.gain.linearRampToValueAtTime(volume,time+.008);
gain.gain.setValueAtTime(volume*.88,time+.14);
gain.gain.exponentialRampToValueAtTime(.0001,time+length);
source.connect(gain);gain.connect(bus);source.start(time);source.stop(time+length+.06);
}
function pad(midi,time,length,volume,bus){
const f=440*Math.pow(2,(midi-69)/12),env=ctx.createGain();
env.gain.setValueAtTime(.0001,time);
env.gain.linearRampToValueAtTime(volume,time+.42);
env.gain.setValueAtTime(volume,time+Math.max(.43,length-.6));
env.gain.linearRampToValueAtTime(.0001,time+length);env.connect(bus);
const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1050;filter.Q.value=.5;filter.connect(env);
for(const [wave,detune,v] of [['sawtooth',-6,.23],['sawtooth',6,.23],['sine',0,.65]]){
const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=wave;osc.frequency.value=f;osc.detune.value=detune;g.gain.value=v;osc.connect(g);g.connect(filter);osc.start(time);osc.stop(time+length+.04);
}
}
async function play(){
if(done)return;
try{
const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio unavailable');
ctx=ctx||new AC();stopSound();const token=playToken;
if(!started){started=true;startAt=Date.now();timer=setInterval(tick,250)}
$('play').textContent='Loading piano…';
await ctx.resume();await preparePiano();
if(done||token!==playToken)return;
$('play').textContent='↻ Replay';
const bus=ctx.createGain();bus.gain.value=.83;bus.connect(ctx.destination);activeBus=bus;
const t=ctx.currentTime+.045;
if(type==='chords')notes.forEach(n=>piano(n,t,5.0,.26/Math.sqrt(notes.length),bus));
else if(type==='intervals'){
if(direction==='harmonic')notes.forEach(n=>piano(n,t,5.0,.2,bus));
else{piano(notes[0],t,2.5,.22,bus);piano(notes[1],t+.75,3.0,.22,bus)}
}else{
const step=.38,total=(notes.length-1)*step+3.0;
if($('drone').checked)pad(droneTonic-12,t,total,.095,bus);
notes.forEach((n,i)=>piano(n,t+i*step,2.5,.21,bus));
}
}catch(e){$('play').textContent='↻ Replay';$('feedback').textContent='Audio could not load: '+e.message}
}
function start(){pool=list().filter(x=>chosen[type].has(x[0]));order=type==='chords'?[...pool].sort((a,b)=>{
const rank=n=>{if(/^m(?!aj)/i.test(n)||n==='Minor')return 0;

if(/aug/i.test(n)||n==='Augmented')return 4;
return 2};
const family=n=>chordGroups['Triads'].some(x=>x[0]===n)?0:chordGroups['Seventh chords'].some(x=>x[0]===n)?1:2;
return family(a[0])-family(b[0])||rank(a[0])-rank(b[0])||list().findIndex(x=>x[0]===a[0])-list().findIndex(x=>x[0]===b[0]);
}):[...pool];attempts=0;correct=0;q=0;stats={};pool.forEach(x=>stats[x[0]]={total:0,correct:0});done=false;started=false;clearInterval(timer);limit=Number($('duration').value)*60;$('clock').textContent=fmt(limit);$('score').textContent='0 / 0 correct';$('gametype').textContent=type.toUpperCase()+' RECOGNITION';$('prompt').textContent=type==='chords'?'Which chord quality do you hear?':type==='intervals'?'Which interval do you hear?':'Which scale do you hear?';$('play').textContent='▶ Play '+({chords:'chord',intervals:'interval',scales:'scale'})[type];show('game');next()}function finish(){if(done)return;done=true;stopSound();clearInterval(timer);const seconds=elapsed();if(started){const k=key(new Date());history[k]??={seconds:0,correct:0,attempts:0,sessions:0};history[k].seconds+=seconds;history[k].correct+=correct;history[k].attempts+=attempts;history[k].sessions++;storageSet('ear094history',history)}$('summary').textContent=correct+' / '+attempts+' correct'+(attempts?' · '+Math.round(correct/attempts*100)+'% accuracy':'');$('time').textContent='Practice time: '+fmt(seconds);$('breakdown').replaceChildren();for(const [name,s] of Object.entries(stats)){if(!s.total)continue;const row=document.createElement('div');row.className='line';const a=document.createElement('span');a.textContent=name;const b=document.createElement('span');b.textContent=s.correct+' / '+s.total+' ('+Math.round(s.correct/s.total*100)+'%)';row.append(a,b);$('breakdown').append(row)}show('results')}['chords','intervals','scales'].forEach(x=>$(x).addEventListener('click',()=>configure(x)));$('back').addEventListener('click',()=>show('home'));$('all').addEventListener('click',()=>{list().forEach(x=>chosen[type].add(x[0]));save();draw()});$('clear').addEventListener('click',()=>{chosen[type].clear();save();draw()});$('goal').addEventListener('change',()=>{goal=Number($('goal').value);save();dashboard()});$('start').addEventListener('click',start);$('play').addEventListener('click',play);$('next').addEventListener('click',()=>{if(answered&&!done)next()});$('finish').addEventListener('click',finish);$('again').addEventListener('click',()=>configure(type));$('tohome').addEventListener('click',()=>show('home'));dashboard()})();
